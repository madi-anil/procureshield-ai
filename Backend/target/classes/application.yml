server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: procureshield-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/procureshield_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Security & JWT configuration
procureshield:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}       # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

  admin:
    bootstrap-email: ${ADMIN_EMAIL:}
    bootstrap-password: ${ADMIN_PASSWORD:}

  r2:
    account-id: ${CLOUDFLARE_R2_ACCOUNT_ID:}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY:}
    secret-key: ${CLOUDFLARE_R2_SECRET_KEY:}
    bucket-name: ${CLOUDFLARE_R2_BUCKET:procureshield-docs}
    endpoint-url: ${CLOUDFLARE_R2_ENDPOINT_URL:}

  ai:
    model: ${AI_MODEL:}
    api-key: ${GEMINI_API_KEY:}
    temperature: 0.0
    max-input-chars: ${AI_MAX_INPUT_CHARS:60000}
    audit-timeout-minutes: ${AI_AUDIT_TIMEOUT_MINUTES:10}
    injection-patterns:
      - "ignore previous instructions"
      - "ignore above instructions"
      - "system prompt"
      - "reveal your prompt"

# Purchase Order approval escalation threshold
approval:
  escalation-threshold: ${APPROVAL_ESCALATION_THRESHOLD:10000.00}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}